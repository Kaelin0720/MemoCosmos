[project]
name = "memocosmos-backend"
version = "1.0.0"
license = "MIT"
description = "Local-first second brain with conversations, knowledge notes and traceable memory"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.14,<2",
    "deepagents==0.7.23",
    "fastapi>=0.115,<1",
    "httpx2==2.13.1",
    "langchain-openai==1.7.0",
    "pydantic>=2.10,<3",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<0.29",
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["posix_storage: Requires POSIX descriptor-based note storage; use WSL2 on Windows"]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
